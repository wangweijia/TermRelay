name: Linux TypeScript agent

on:
  push:
    paths:
      - apps/linux/**
      - packages/contracts/**
      - apps/server/**
      - apps/web/**
      - scripts/**
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/linux.yml
  pull_request:
    paths:
      - apps/linux/**
      - packages/contracts/**
      - apps/server/**
      - apps/web/**
      - scripts/**
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/linux.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable declared pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Exercise TypeScript service, native PTY and owned cleanup
        run: env -u DISPLAY -u WAYLAND_DISPLAY pnpm linux:test
      - name: Validate Linux events through Server
        run: pnpm linux:contracts
      - name: Check repository release tooling
        run: pnpm test:release
      - name: Build and install private-runtime package
        run: |
          pnpm release:linux
          sudo apt-get install -y ./dist/termrelay-linux/termrelay-linux_0.1.0_amd64.deb
          cd /tmp
          # Restrict PATH: no setup-node, pnpm or Python is needed by the installed CLI.
          PATH=/nonexistent /usr/bin/termrelay-agent --help
          PATH=/nonexistent /usr/bin/termrelay-linux configure --server ws://localhost:3007/ws/client --name CI
          PATH=/nonexistent /usr/bin/termrelay-agent workspace add /tmp --name temporary
          PATH=/nonexistent /usr/bin/termrelay-agent session add --workspace temporary --provider shell
          PATH=/nonexistent /usr/bin/termrelay-agent doctor
          test -f /usr/lib/systemd/user/termrelay-agent.service
      - uses: actions/upload-artifact@v4
        with:
          name: termrelay-linux-${{ matrix.os }}-amd64
          path: dist/termrelay-linux/*.deb
